<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jaya - Status Room</title>
    <style>
        :root { 
            --primary: #00e5ff; 
            --bg: #030a1a; 
            --card-bg: rgba(6, 17, 39, 0.9); 
            --text-main: #ffffff; 
            --text-muted: #8a99b3;
            --red: #ff4444; 
            --neon-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .p-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .red-tick {
            width: 14px;
            height: 14px;
            margin-left: 4px;
            vertical-align: middle;
            fill: #ff4444;
        }

        /* NEW RED TICK CSS IMPORTED FROM INDEX */
        .red-tick-svg {
            width: 16px;
            height: 16px;
            color: #ff4444;
            margin-left: 4px;
            vertical-align: middle;
            filter: drop-shadow(0 0 5px rgba(255, 68, 68, 0.4));
            display: inline-block;
        }

        /* --- STORIES TRAY COMPONENT --- */
        .stories-tray {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 0;
            margin-bottom: 25px;
        }

        .stories-tray::-webkit-scrollbar { display: none; }

        .story-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid var(--text-muted); /* Default grey for seen */
            padding: 2px;
            transition: all 0.3s ease;
        }

        .story-ring.unseen {
            border-color: var(--primary);
            box-shadow: var(--neon-shadow);
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .story-username {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CONTROL CARD PANEL --- */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .toggle-upload-btn {
            width: 100%;
            background: rgba(0, 229, 255, 0.1);
            color: var(--primary);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
        }
        .toggle-upload-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .upload-container {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        textarea, input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .file-input-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-upload-label {
            background: rgba(0, 229, 255, 0.1);
            color: var(--primary);
            border: 1px dashed var(--primary);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .btn-upload-label svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #030a1a;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--neon-shadow);
        }

        /* --- FULLSCREEN ULTRA VIEW MODAL --- */
        .status-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .viewer-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        
        .viewer-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
            z-index: 10;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .action-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .action-btn.delete-btn { color: var(--red); }

        .viewer-content {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .viewer-content img, .viewer-content video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .viewer-text {
            font-size: 24px;
            text-align: center;
            padding: 20px;
            word-break: break-word;
        }

        /* --- VIEWER NAVIGATION & COUNTER --- */
        .viewer-nav-area {
            position: absolute;
            top: 70px;
            bottom: 50px;
            left: 0;
            right: 0;
            display: flex;
            z-index: 5;
        }
        
        .nav-left, .nav-right {
            flex: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .status-counter-display {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        /* --- VIEWER LIST MODAL --- */
        .viewers-list-modal {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            max-height: 50vh;
            overflow-y: auto;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
            border-top: 1px solid rgba(0, 229, 255, 0.2);
        }
        
        .viewers-list-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .viewer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .viewer-item img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* --- FLOATING BUTTONS (HOME PAGE) --- */
        .floating-actions {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            z-index: 100;
        }

        .float-btn {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--neon-shadow);
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .float-btn:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .float-btn.bits-btn {
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* ================= NEW: STATUS SONG ATTACHMENT (SAME METHOD AS INDEX.HTML'S
           ONLINE SONG SEARCH, BAS YAHAN CLIP SIRF 15 SECOND TAK LIMITED HAI) =================
           Sirf naya CSS add kiya gaya hai. Upar ka koi bhi purana style/feature/method
           chheda nahi gaya hai. */
        .song-search-results {
            position: relative; width: 100%; background: rgba(6, 17, 39, 0.98);
            border: 1px solid var(--primary); border-radius: 12px; max-height: 220px; overflow-y: auto;
            z-index: 20; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; backdrop-filter: blur(10px);
            margin-bottom: 10px;
        }
        .song-preview-container { margin-bottom: 10px; }
        .song-preview-chip {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px; padding: 6px 10px;
        }
        .song-preview-chip audio { flex: 1; height: 32px; min-width: 0; }
        .song-preview-chip .song-name-label { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-remove-btn {
            cursor: pointer; color: var(--red); font-weight: bold;
            font-size: 15px; padding: 0 4px; flex-shrink: 0;
        }
        .song-name-label { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-search-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; cursor: default;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .song-search-item:hover { background: rgba(0, 229, 255, 0.08); }
        .song-search-item-artwork { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.06); }
        .song-search-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .song-search-item-title { color: var(--text-main); font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-search-item-artist { color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-preview-btn {
            width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0, 229, 255, 0.35);
            background: rgba(255,255,255,0.06); color: var(--primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .song-preview-btn svg { width: 18px; height: 18px; }
        .song-preview-btn.playing { background: var(--primary); color: #fff; box-shadow: var(--neon-shadow); }
        .song-select-btn {
            flex-shrink: 0; flex-grow: 0; border: 1px solid var(--primary); color: var(--primary); background: transparent;
            border-radius: 12px; padding: 2px 0; font-size: 9px; font-weight: 700; cursor: pointer; transition: 0.2s;
            line-height: 1.4; width: 40px; text-align: center;
        }
        .song-select-btn:hover { background: var(--primary); color: #fff; }
        .song-select-btn.song-select-btn-hidden { display: none; }
        .song-select-btn.song-select-btn-pop { animation: songSelectPop 0.18s ease-out; }
        @keyframes songSelectPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes songPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }
        /* --- Status viewer: audio-status slide look --- */
        .viewer-song-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; padding: 20px; text-align: center;
        }
        .viewer-song-icon {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(0, 229, 255, 0.1); border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--neon-shadow);
            animation: songPulse 1.6s ease-in-out infinite;
        }
        .viewer-song-icon svg { width: 40px; height: 40px; fill: var(--primary); }
        .viewer-song-title { font-size: 18px; font-weight: bold; color: #fff; }
        .viewer-song-artist { font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <img id="user-avatar" src="" class="p-pic" alt="Profile">
            <div>
                <div style="font-weight: bold; font-size: 18px; display: flex; align-items: center;" id="welcome-username-container">
                    <span id="welcome-username">@username</span>
                </div>
                <div style="font-size: 12px; color: var(--text-muted);">The Jaya Status Room</div>
            </div>
        </header>

        <div class="stories-tray" id="stories-tray-zone"></div>

        <div class="card">
            <button class="toggle-upload-btn" onclick="toggleUploadUI()">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Add New Status
            </button>
            
            <div class="upload-container" id="upload-ui-container">
                <textarea id="status-text-input" placeholder="What's on your mind? Type a status..."></textarea>
                
                <div class="file-input-wrapper">
                    <label class="btn-upload-label">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                        Photos
                        <input type="file" id="photo-files" accept="image/*" multiple style="display: none;" onchange="validateFiles()">
                    </label>
                    <label class="btn-upload-label">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" stroke="currentColor" stroke-width="2" fill="none"/><line x1="7" y1="2" x2="7" y2="22" stroke="currentColor" stroke-width="2"/><line x1="17" y1="2" x2="17" y2="22" stroke="currentColor" stroke-width="2"/><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/><line x1="2" y1="7" x2="7" y2="7" stroke="currentColor" stroke-width="2"/><line x1="2" y1="17" x2="7" y2="17" stroke="currentColor" stroke-width="2"/><line x1="17" y1="17" x2="22" y2="17" stroke="currentColor" stroke-width="2"/><line x1="17" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="2"/></svg>
                        Videos
                        <input type="file" id="video-files" accept="video/*" multiple style="display: none;" onchange="validateFiles()">
                    </label>
                </div>
                <div id="file-count-status" style="font-size: 12px; margin-bottom: 10px; color: var(--text-muted);"></div>

                <!-- ================= NEW: Online song search row for Status =================
                     Index.html ke "New Post" wale online song search jaisa hi method use kiya
                     gaya hai (same iTunes search + preview-listen-then-Use flow), bas yahan
                     status ke liye attach hone wala clip max 15 second tak hi limited hai.
                     Purana photo/video/text status feature ya method kuchh bhi chheda nahi
                     gaya hai — yeh sirf ek naya, optional addition hai. -->
                <div>
                    <input type="text" id="statusSongSearchInput" placeholder="🎵 Add a song (15s clip)..." oninput="handleStatusSongSearchInput()">
                </div>
                <div id="statusSongSearchResults" class="song-search-results"></div>
                <div id="statusSongPreviewContainer" class="song-preview-container"></div>

                <button class="btn-submit" onclick="publishStatus()">Upload Status</button>
            </div>
        </div>
    </div>

    <div class="floating-actions">
        <a href="thejayabit.html" class="float-btn bits-btn">Bits</a>
        <a href="javascript:void(0)" class="float-btn" onclick="goBackFromStatus()">> Back</a>
    </div>

    <div class="status-viewer" id="status-player-modal">
        <div class="progress-container"><div class="progress-bar" id="status-progress"></div></div>
        
        <div class="viewer-header">
            <div class="viewer-user-info">
                <img id="viewer-avatar" src="" class="p-pic" style="width: 35px; height: 35px;">
                <strong id="viewer-username-container" style="display:flex; align-items:center;">
                    <span id="viewer-username"></span>
                </strong>
            </div>
            
            <div class="viewer-actions">
                <button id="view-count-btn" class="action-btn" style="display:none;" onclick="showViewers()">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                    <span id="view-count-text">0</span>
                </button>
                <button id="delete-status-btn" class="action-btn delete-btn" style="display:none;" onclick="deleteCurrentStatus()">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
                <button class="action-btn" onclick="closeStatusViewer()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
        </div>

        <div class="viewer-nav-area">
            <div class="nav-left" onclick="skipPrev()"></div>
            <div class="nav-right" onclick="skipNext()"></div>
        </div>

        <div class="viewer-content" id="viewer-body-render"></div>

        <div id="status-counter-display" class="status-counter-display">1/1</div>
        
        <div id="viewers-list-panel" class="viewers-list-modal">
            <div class="viewers-list-header">
                <span>Viewed By</span>
                <span style="cursor:pointer;" onclick="hideViewers()">
                    <svg style="width:20px;height:20px;fill:var(--text-main)" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </span>
            </div>
            <div id="viewers-list-content"></div>
        </div>
    </div>

    <template id="red-tick-svg">
        <svg class="red-tick" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
    </template>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCwsiYyKy6r2rKu-nGy7lu9Zv0aL9SE-8M",
            authDomain: "links-62592.firebaseapp.com",
            databaseURL: "https://links-62592-default-rtdb.firebaseio.com",
            projectId: "links-62592",
            storageBucket: "links-62592.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.setDoc = setDoc;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.deleteDoc = deleteDoc;

        let activeSessionUser = null;

        /* ================= NEW: OFFLINE WORKS REGARDLESS OF LOGIN STATE =================
           Purana onAuthStateChanged flow (niche) bilkul waisa hi hai jab user online hai aur
           login + profile fetch dono successful hote hain — us case me kuchh nahi badla,
           "Access Denied" wala purana security-check bhi online case ke liye waisa hi hai.
           Yeh sirf ek naya OFFLINE-ONLY fallback add karta hai: agar net hi nahi hai (chahe
           user index.html me login ho ya na ho — auth/profile check offline fail ho sakta
           hai), to seedha error dikha kar redirect karne ki jagah, pehle se cache ho chuka
           stories + profile data (localStorage) dikha diya jata hai, jaisa WhatsApp offline
           chats dikhata hai. Agar bilkul bhi cached data na mile, tabhi purana "please login"
           wala behavior chalega — matlab purana method/feature kahin se hataya nahi gaya. */
        const STATUS_USER_CACHE_KEY = 'thejaya_status_user_cache';

        function cacheActiveUserProfile(profile) {
            try { localStorage.setItem(STATUS_USER_CACHE_KEY, JSON.stringify(profile)); } catch (e) {}
        }

        function tryOfflineGuestFallback() {
            const cachedStoriesRaw = localStorage.getItem('thejaya_stories_db_live');
            const cachedProfileRaw = localStorage.getItem(STATUS_USER_CACHE_KEY);
            if (!cachedStoriesRaw && !cachedProfileRaw) return false; // kuchh bhi cached nahi — purana behavior chalne do

            activeSessionUser = cachedProfileRaw ? JSON.parse(cachedProfileRaw) : null;
            initializeStatusEngine(true);
            return true;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userSnap = await getDoc(doc(db, "users", user.uid));
                    if (userSnap.exists()) {
                        activeSessionUser = userSnap.data();
                        cacheActiveUserProfile(activeSessionUser); // NEW: agli baar offline fallback ke liye save
                        initializeStatusEngine();
                    } else if (!navigator.onLine && tryOfflineGuestFallback()) {
                        // NEW: offline hone ki wajah se profile fetch nahi ho paya — cached data se dikha diya
                    } else {
                        throwAuthError();
                    }
                } catch (e) {
                    if (!navigator.onLine && tryOfflineGuestFallback()) {
                        // NEW: offline hone ki wajah se profile fetch fail hua — cached data se dikha diya
                    } else {
                        throwAuthError();
                    }
                }
            } else if (!navigator.onLine && tryOfflineGuestFallback()) {
                // NEW: offline hai aur login-state confirm nahi ho paya — cached data se dikha diya
            } else {
                throwAuthError();
            }
        });

        /* ================= NEW: EMBEDDED-INSIDE-INDEX SUPPORT =================
           Sirf naya code add kiya gaya hai. Purana koi bhi feature/function chheda
           nahi gaya. Agar yeh page index.html ke andar ek iframe (status-embed-modal)
           me khula hai, to "Back" ya auth-fail par alag page par navigate karne ki
           jagah, parent ko close karne ka message bhej diya jata hai. Agar yeh page
           seedha (standalone, iframe ke bina) khula hai, to purana behavior (index.html
           par navigate karna) bilkul waisa hi kaam karega. */
        const isEmbeddedInIndex = (window.self !== window.top);
        window.goBackFromStatus = function() {
            if (isEmbeddedInIndex) { window.parent.postMessage('thejaya-close-status-embed', '*'); }
            else { window.location.href = "index.html"; }
        };

        function throwAuthError() {
            alert("❌ Access Denied: Please login via the official website 'The Jaya' first!");
            if (isEmbeddedInIndex) { window.parent.postMessage('thejaya-close-status-embed', '*'); }
            else { window.location.href = "index.html"; }
        }

        function initializeStatusEngine(isOfflineFallback) {
            // NEW: agar offline-fallback me cached profile bhi nahi mila (bilkul guest view),
            // to purana crash hone ki jagah ek generic placeholder dikhao. Jab activeSessionUser
            // maujood hai (normal login case, purana behavior), yeh block bilkul waisa hi chalta hai.
            if (activeSessionUser) {
                document.getElementById('user-avatar').src = activeSessionUser.pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                document.getElementById('welcome-username').innerText = "@" + activeSessionUser.username;

                if (activeSessionUser.hasRedTick || activeSessionUser.redTick || activeSessionUser.verified || activeSessionUser.role === 'admin') {
                    document.getElementById('welcome-username-container').innerHTML += `<svg viewBox="0 0 24 24" class="red-tick-svg" title="Verified"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
                }
            } else {
                document.getElementById('user-avatar').src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                document.getElementById('welcome-username').innerText = "@guest (offline)";
            }

            window.currentUserProfile = activeSessionUser;
            window.globalStories = JSON.parse(localStorage.getItem('thejaya_stories_db_live') || '[]');
            window.renderStoriesTray();

            if (isOfflineFallback) {
                // NEW: abhi net nahi hai, isliye live Firestore listener nahi lagaya — sirf
                // cached stories dikhayi gayi hain. renderStatusConnectionBadge() (purana,
                // niche wale classic <script> me already defined) offline badge dikha dega.
                // Net wapas aate hi engine ko wapas normal (live) mode me le aao — purana
                // online flow bilkul waisa hi chalega, kuchh hataya nahi gaya.
                if (typeof window.renderStatusConnectionBadge === 'function') window.renderStatusConnectionBadge();
                window.addEventListener('online', function onBackOnline() {
                    window.removeEventListener('online', onBackOnline);
                    window.location.reload();
                });
            } else {
                window.setupRealtimeStories();
            }
        }
    </script>

    <script>
        const PHOTO_LIMIT = 10;
        const VIDEO_LIMIT = 5;
        const EXPIRATION_TIME = 24 * 60 * 60 * 1000;

        let storyPlaybackTimer = null;
        let progressAnimationInterval = null;
        let currentViewingStory = null;
        let currentSlideIndex = 0;
        let isViewerPaused = false;
        
        window.globalStories = [];

        window.setupRealtimeStories = function() {
            const storiesRef = window.collection(window.db, "status_stories");
            window.onSnapshot(storiesRef, (snapshot) => {
                let liveDatabase = [];
                snapshot.forEach((doc) => {
                    liveDatabase.push(doc.data());
                });
                const now = Date.now();
                liveDatabase.forEach(story => {
                    story.slides = story.slides.filter(slide => (now - slide.timestamp) < EXPIRATION_TIME);
                });
                window.globalStories = liveDatabase.filter(story => story.slides.length > 0);
                localStorage.setItem('thejaya_stories_db_live', JSON.stringify(window.globalStories));
                markStatusLastSync(); // NEW: har online update ke saath "last online" time bhi save karo
                window.renderStoriesTray();
            });
        };

        /* ================= NEW: ONLINE/OFFLINE LAST-ACTIVITY SNAPSHOT (WhatsApp jaisa) =================
           Purana koi bhi feature/function/method chheda nahi gaya — yeh sirf naya, alag
           naam wala code hai jo upar wale live-sync ke saath add ho raha hai.

           Method: user jab tak online hai, har live update (upar wale onSnapshot me)
           localStorage me already save hota rehta hai (thejaya_stories_db_live) — ab
           uske saath-saath us update ka exact time bhi (thejaya_stories_last_sync_ts)
           save ho raha hai. Jaise hi browser "offline" ho jata hai, window.globalStories
           ko chheda nahi jata — wahi localStorage me save hua aakhri (last-online-time
           ka) data UI par dikhta rehta hai, bas ek chhota badge dikhakar bataya jata hai
           ki yeh us time ka status hai jab user offline hua tha (WhatsApp ke "last seen"
           jaisa). Wapas online hote hi badge hat jata hai aur Firestore ka onSnapshot
           khud fresh data laa kar localStorage update kar deta hai — jaisa pehle se ho
           raha tha. */
        const STATUS_LAST_SYNC_KEY = 'thejaya_stories_last_sync_ts';

        function markStatusLastSync() {
            localStorage.setItem(STATUS_LAST_SYNC_KEY, Date.now().toString());
        }

        function getStatusLastSyncLabel() {
            const ts = parseInt(localStorage.getItem(STATUS_LAST_SYNC_KEY) || '0', 10);
            if (!ts) return '';
            const d = new Date(ts);
            let hours = d.getHours();
            const minutes = d.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function renderStatusConnectionBadge() {
            const tray = document.getElementById('stories-tray-zone');
            if (!tray || !tray.parentNode) return;
            let badge = document.getElementById('status-connection-badge');
            if (!badge) {
                badge = document.createElement('div');
                badge.id = 'status-connection-badge';
                badge.style.cssText = 'font-size:11px;color:var(--text-muted);text-align:center;margin:-10px 0 15px;';
                tray.parentNode.insertBefore(badge, tray);
            }
            if (navigator.onLine) {
                badge.innerText = '';
            } else {
                const label = getStatusLastSyncLabel();
                badge.innerText = label ? `⚫ Offline — showing status as of ${label}` : '⚫ Offline';
            }
        }

        window.addEventListener('offline', renderStatusConnectionBadge);
        window.addEventListener('online', renderStatusConnectionBadge);
        document.addEventListener('DOMContentLoaded', renderStatusConnectionBadge);

        /* ================= NEW: FIREBASE-INDEPENDENT OFFLINE SAFETY NET =================
           Purana upar wala Firebase <script type="module"> (auth + live-sync) aur uska
           offline/guest fallback bilkul waisa hi hai, kuchh chheda nahi gaya. Yeh sirf ek
           alag, standalone safety-net hai: agar device pura offline hai to kabhi-kabhi
           us module ka CDN se Firebase import hi fail ho sakta hai, jiski wajah se upar
           wala pura auth flow (aur uska offline fallback) kabhi chalta hi nahi, aur stories
           tray khaali reh jaati. Thodi der (module ko load/init hone ka mauka dene ke liye)
           wait karne ke baad, agar abhi tak koi profile set hi nahi hua (module flow chal
           nahi paya), to seedha localStorage se cached stories + profile load karke offline
           view dikha diya jata hai — bina Firebase par depend kiye.*/
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                if (window.currentUserProfile !== undefined) return; // module flow already chal chuka (login ya guest fallback dono)
                const cachedStoriesRaw = localStorage.getItem('thejaya_stories_db_live');
                const cachedProfileRaw = localStorage.getItem('thejaya_status_user_cache');
                if (!cachedStoriesRaw && !cachedProfileRaw) return; // kuchh bhi cached nahi mila — kuchh nahi kiya ja sakta

                const cachedProfile = cachedProfileRaw ? JSON.parse(cachedProfileRaw) : null;
                window.currentUserProfile = cachedProfile;
                document.getElementById('user-avatar').src = (cachedProfile && cachedProfile.pic) || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                document.getElementById('welcome-username').innerText = cachedProfile ? ("@" + cachedProfile.username) : "@guest (offline)";
                window.globalStories = JSON.parse(cachedStoriesRaw || '[]');
                if (typeof window.renderStoriesTray === 'function') window.renderStoriesTray();
                renderStatusConnectionBadge();
            }, 1500);
        });

        function toggleUploadUI() {
            // NEW: offline/guest mode me (koi logged-in profile cached nahi mila) naya status
            // upload nahi ho sakta (upload karne ke liye pehchaan chahiye) — is case me pehle
            // hi bata diya jata hai. Jab user logged in hai (purana normal case), yeh check
            // skip ho jata hai aur niche wala purana toggle-logic bilkul waisa hi chalta hai.
            if (!window.currentUserProfile) { alert("📴 You're viewing cached statuses offline. Please log in with internet to post a new status."); return; }
            const ui = document.getElementById('upload-ui-container');
            ui.style.display = ui.style.display === 'block' ? 'none' : 'block';
        }

        function validateFiles() {
            const photos = document.getElementById('photo-files').files;
            const videos = document.getElementById('video-files').files;
            const indicator = document.getElementById('file-count-status');
            if(photos.length > PHOTO_LIMIT) { alert(`Maximum ${PHOTO_LIMIT} photos allowed!`); document.getElementById('photo-files').value = ""; return; }
            if(videos.length > VIDEO_LIMIT) { alert(`Maximum ${VIDEO_LIMIT} videos allowed!`); document.getElementById('video-files').value = ""; return; }
            indicator.innerText = `Selected: ${photos.length} Photo(s) | ${videos.length} Video(s)`;
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1200;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) { height *= maxDim / width; width = maxDim; }
                            else { width *= maxDim / height; height = maxDim; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        let quality = 0.7;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        if (dataUrl.length > 1000000) { quality = 0.5; dataUrl = canvas.toDataURL('image/jpeg', quality); }
                        resolve(dataUrl);
                    };
                };
            });
        }

        /* ================= NEW: STATUS SONG ATTACHMENT LOGIC =================
           Same method/flow index.html ke "New Post" online song search jaisa hai
           (iTunes search API, listen-preview then "Use" button, trimmed clip).
           Sirf yahan farak itna hai ki status ke liye attach hone wala clip max
           15 second tak hi hota hai (SONG_MAX_TRIM_SECONDS). Purana koi bhi
           status feature/function chheda nahi gaya — yeh sab naye, alag naam
           wale functions/variables hain. */
        let selectedStatusSongData = null;
        let statusSongSearchDebounceTimer;
        const STATUS_SONG_MAX_TRIM_SECONDS = 15; // status ke liye 15-second cap

        function fmtStatusSongSec(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        let statusSongResultPreviewAudio = null;
        let statusSongResultPreviewBtnEl = null;
        const statusSongPreviewPlayIconSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const statusSongPreviewPauseIconSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

        window.toggleStatusSongResultPreview = (track, btnEl) => {
            if (statusSongResultPreviewAudio && statusSongResultPreviewBtnEl === btnEl) {
                stopStatusSongResultPreview();
                return;
            }
            stopStatusSongResultPreview();
            const audio = new Audio(track.previewUrl);
            audio.play();
            btnEl.classList.add('playing');
            btnEl.innerHTML = statusSongPreviewPauseIconSVG;
            audio.onended = () => stopStatusSongResultPreview();
            statusSongResultPreviewAudio = audio;
            statusSongResultPreviewBtnEl = btnEl;
        };

        function stopStatusSongResultPreview() {
            if (statusSongResultPreviewAudio) {
                statusSongResultPreviewAudio.pause();
                statusSongResultPreviewAudio.currentTime = 0;
            }
            if (statusSongResultPreviewBtnEl) {
                statusSongResultPreviewBtnEl.classList.remove('playing');
                statusSongResultPreviewBtnEl.innerHTML = statusSongPreviewPlayIconSVG;
            }
            statusSongResultPreviewAudio = null;
            statusSongResultPreviewBtnEl = null;
        }

        window.handleStatusSongSearchInput = () => {
            clearTimeout(statusSongSearchDebounceTimer);
            const val = document.getElementById('statusSongSearchInput').value.trim();
            const resultsBox = document.getElementById('statusSongSearchResults');

            if (!val) {
                resultsBox.style.display = 'none';
                resultsBox.innerHTML = '';
                return;
            }

            statusSongSearchDebounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(val)}&media=music&limit=8`);
                    const data = await res.json();
                    const tracks = (data.results || []).filter(t => t.previewUrl);

                    resultsBox.innerHTML = '';
                    if (tracks.length === 0) {
                        resultsBox.style.display = 'none';
                        return;
                    }
                    resultsBox.style.display = 'block';

                    tracks.forEach(t => {
                        const item = document.createElement('div');
                        item.className = 'song-search-item';

                        const artwork = document.createElement('img');
                        artwork.className = 'song-search-item-artwork';
                        artwork.src = t.artworkUrl60 || t.artworkUrl100 || '';
                        artwork.alt = '';

                        const info = document.createElement('div');
                        info.className = 'song-search-item-info';
                        info.innerHTML = `<span class="song-search-item-title">${t.trackName}</span><span class="song-search-item-artist">${t.artistName || ''}</span>`;

                        const useBtn = document.createElement('button');
                        useBtn.type = 'button';
                        useBtn.className = 'song-select-btn song-select-btn-hidden';
                        useBtn.textContent = 'Use';
                        useBtn.onclick = () => {
                            const durSec = Math.round((t.trackTimeMillis || 15000) / 1000);
                            const end = Math.max(1, Math.min(durSec, STATUS_SONG_MAX_TRIM_SECONDS));
                            selectStatusOnlineSong(t, durSec, 0, end);
                        };

                        const previewBtn = document.createElement('div');
                        previewBtn.className = 'song-preview-btn';
                        previewBtn.title = 'Listen';
                        previewBtn.innerHTML = statusSongPreviewPlayIconSVG;
                        previewBtn.onclick = () => {
                            toggleStatusSongResultPreview(t, previewBtn);
                            if (useBtn.classList.contains('song-select-btn-hidden')) {
                                useBtn.classList.remove('song-select-btn-hidden');
                                useBtn.classList.add('song-select-btn-pop');
                            }
                        };

                        item.appendChild(artwork);
                        item.appendChild(previewBtn);
                        item.appendChild(info);
                        item.appendChild(useBtn);
                        resultsBox.appendChild(item);
                    });
                } catch (err) {
                    console.error("Status online song search failed:", err);
                }
            }, 400);
        };

        window.selectStatusOnlineSong = (track, durationSec, start, end) => {
            stopStatusSongResultPreview();
            const s = (typeof start === 'number') ? start : 0;
            let e = (typeof end === 'number') ? end : STATUS_SONG_MAX_TRIM_SECONDS;
            e = Math.min(e, s + STATUS_SONG_MAX_TRIM_SECONDS); // hard cap: 15 second se zyada kabhi nahi
            selectedStatusSongData = { url: track.previewUrl, name: track.trackName, artist: track.artistName, start: s, end: e, duration: durationSec || STATUS_SONG_MAX_TRIM_SECONDS };
            document.getElementById('statusSongSearchInput').value = "";
            document.getElementById('statusSongSearchResults').style.display = 'none';
            document.getElementById('statusSongSearchResults').innerHTML = '';
            renderStatusSongPreview();
        };

        function renderStatusSongPreview() {
            const box = document.getElementById('statusSongPreviewContainer');
            box.innerHTML = '';
            if (!selectedStatusSongData) return;
            const rangeLabel = ` (${fmtStatusSongSec(selectedStatusSongData.start)}–${fmtStatusSongSec(selectedStatusSongData.end)})`;
            const chip = document.createElement('div');
            chip.className = 'song-preview-chip';
            chip.innerHTML = `<span class="song-name-label">${selectedStatusSongData.name}${selectedStatusSongData.artist ? ' — ' + selectedStatusSongData.artist : ''}${rangeLabel}</span>
                <audio controls src="${selectedStatusSongData.url}"></audio>
                <span class="song-remove-btn" onclick="removeSelectedStatusSong()" title="Remove song">✕</span>`;
            box.appendChild(chip);
        }

        window.removeSelectedStatusSong = () => {
            selectedStatusSongData = null;
            renderStatusSongPreview();
        };

        async function publishStatus() {
            if (!window.currentUserProfile) return;
            const textContent = document.getElementById('status-text-input').value.trim();
            const photoFiles = document.getElementById('photo-files').files;
            const videoFiles = document.getElementById('video-files').files;

            if (!textContent && photoFiles.length === 0 && videoFiles.length === 0 && !selectedStatusSongData) { alert("Please write something or select media/song to upload!"); return; }

            for (let i = 0; i < videoFiles.length; i++) {
                if (videoFiles[i].size > 1024 * 1024) { alert(`Video "${videoFiles[i].name}" is too large. Please upload video smaller than 1MB.`); return; }
            }

            document.querySelector('.btn-submit').innerText = "Processing & Uploading...";
            document.querySelector('.btn-submit').disabled = true;

            const newSlides = [];
            const now = Date.now();

            if (textContent) { newSlides.push({ id: 's_'+now+'_t', type: 'text', content: textContent, duration: 10000, timestamp: now, viewedBy: [] }); }

            for(let i=0; i<photoFiles.length; i++) {
                const compressedB64 = await compressImage(photoFiles[i]);
                newSlides.push({ id: 's_'+now+'_p'+i, type: 'image', content: compressedB64, duration: 10000, timestamp: now, viewedBy: [] });
            }

            for(let i=0; i<videoFiles.length; i++) {
                const b64Data = await convertToBase64(videoFiles[i]);
                newSlides.push({ id: 's_'+now+'_v'+i, type: 'video', content: b64Data, duration: 25000, timestamp: now, viewedBy: [] });
            }

            // NEW: song slide (max 15 second clip) — purana text/photo/video slide-creation logic
            // bilkul waisa hi hai, yeh sirf ek naya, optional slide type add karta hai.
            if (selectedStatusSongData) {
                const clipSeconds = Math.max(1, Math.min(selectedStatusSongData.end - selectedStatusSongData.start, STATUS_SONG_MAX_TRIM_SECONDS));
                newSlides.push({
                    id: 's_'+now+'_song',
                    type: 'song',
                    content: selectedStatusSongData.url,
                    songName: selectedStatusSongData.name,
                    songArtist: selectedStatusSongData.artist || '',
                    start: selectedStatusSongData.start,
                    duration: clipSeconds * 1000,
                    timestamp: now,
                    viewedBy: []
                });
            }
            
            const existingUserIndex = window.globalStories.findIndex(story => story.uid === window.currentUserProfile.uid);
            let storyDataToSave;

            if (existingUserIndex > -1) {
                storyDataToSave = { ...window.globalStories[existingUserIndex] };
                storyDataToSave.slides.push(...newSlides);
            } else {
                storyDataToSave = {
                    uid: window.currentUserProfile.uid,
                    username: window.currentUserProfile.username,
                    avatar: window.currentUserProfile.pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
                    redTick: window.currentUserProfile.hasRedTick || window.currentUserProfile.redTick || window.currentUserProfile.verified || false,
                    hasRedTick: window.currentUserProfile.hasRedTick || window.currentUserProfile.redTick || window.currentUserProfile.verified || false,
                    slides: newSlides
                };
            }

            try {
                const userDocRef = window.doc(window.db, "status_stories", window.currentUserProfile.uid);
                await window.setDoc(userDocRef, storyDataToSave);
                markStatusLastSync(); // NEW: apna upload bhi ek "online activity" hai, last-sync time update karo
                document.getElementById('status-text-input').value = "";
                document.getElementById('photo-files').value = "";
                document.getElementById('video-files').value = "";
                document.getElementById('file-count-status').innerText = "";
                removeSelectedStatusSong(); // NEW: clear attached song after successful upload
                toggleUploadUI();
                alert("🚀 Status uploaded successfully!");
            } catch (error) {
                console.error("Upload Error: ", error);
                alert("❌ Upload failed. Please try again.");
            } finally {
                document.querySelector('.btn-submit').innerText = "Upload Status";
                document.querySelector('.btn-submit').disabled = false;
            }
        }

        window.renderStoriesTray = function() {
            const tray = document.getElementById('stories-tray-zone');
            tray.innerHTML = "";
            if(window.globalStories.length === 0) { tray.innerHTML = `<div style="color:var(--text-muted); font-size:13px; padding-left:5px;">No active updates available...</div>`; return; }
            window.globalStories.forEach(userStory => {
                const node = document.createElement('div');
                node.className = 'story-node';
                node.onclick = () => openStatusViewer(userStory);
                const isCurrentUser = (window.currentUserProfile && userStory.uid === window.currentUserProfile.uid);
                let hasUnseen = false;
                if(!isCurrentUser && window.currentUserProfile) {
                    hasUnseen = userStory.slides.some(slide => !slide.viewedBy.some(v => v.uid === window.currentUserProfile.uid));
                }
                const tickHtml = (userStory.hasRedTick || userStory.redTick) ? `<svg viewBox="0 0 24 24" class="red-tick-svg" title="Verified"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>` : '';
                node.innerHTML = `<div class="story-ring ${hasUnseen ? 'unseen' : ''}"><img src="${userStory.avatar}" alt="user"></div><div class="story-username">@${userStory.username} ${tickHtml}</div>`;
                tray.appendChild(node);
            });
        }

        function openStatusViewer(storyData) {
            currentViewingStory = storyData;
            currentSlideIndex = 0;
            const modal = document.getElementById('status-player-modal');
            document.getElementById('viewer-avatar').src = storyData.avatar;
            const usernameContainer = document.getElementById('viewer-username-container');
            usernameContainer.innerHTML = `<span id="viewer-username">@${storyData.username}</span>`;
            if(storyData.hasRedTick || storyData.redTick) {
                usernameContainer.innerHTML += `<svg viewBox="0 0 24 24" class="red-tick-svg" title="Verified"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
            }
            modal.style.display = 'flex';
            playSlideshow();
        }

        window.skipNext = function() { currentSlideIndex++; if(currentSlideIndex >= currentViewingStory.slides.length) closeStatusViewer(); else playSlideshow(); }
        window.skipPrev = function() { currentSlideIndex--; if(currentSlideIndex < 0) currentSlideIndex = 0; playSlideshow(); }

        function playSlideshow() {
            if(currentSlideIndex >= currentViewingStory.slides.length) { closeStatusViewer(); return; }
            const renderTarget = document.getElementById('viewer-body-render');
            const progressBar = document.getElementById('status-progress');
            // NEW: stop any previously playing status-song audio before rendering the next slide
            // (purana image/video/text rendering logic ke saath koi chhed-chhaad nahi).
            if (renderTarget._statusSongAudio) { renderTarget._statusSongAudio.pause(); renderTarget._statusSongAudio = null; }
            renderTarget.innerHTML = "";
            progressBar.style.width = "0%";
            isViewerPaused = false;
            const slide = currentViewingStory.slides[currentSlideIndex];
            const isOwner = (window.currentUserProfile && currentViewingStory.uid === window.currentUserProfile.uid);
            document.getElementById('status-counter-display').innerText = `${currentSlideIndex + 1} / ${currentViewingStory.slides.length}`;

            if (!isOwner && window.currentUserProfile) {
                const alreadyViewed = slide.viewedBy.some(v => v.uid === window.currentUserProfile.uid);
                if (!alreadyViewed) { slide.viewedBy.push({ uid: window.currentUserProfile.uid, username: window.currentUserProfile.username, avatar: window.currentUserProfile.pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png", hasRedTick: window.currentUserProfile.hasRedTick || window.currentUserProfile.redTick || false }); syncToDatabase(); }
            }

            if (isOwner) { document.getElementById('delete-status-btn').style.display = 'flex'; document.getElementById('view-count-btn').style.display = 'flex'; document.getElementById('view-count-text').innerText = slide.viewedBy.length; } 
            else { document.getElementById('delete-status-btn').style.display = 'none'; document.getElementById('view-count-btn').style.display = 'none'; }

            let playbackTimeoutLimit = slide.duration;
            if (slide.type === 'text') { const textBlock = document.createElement('div'); textBlock.className = 'viewer-text'; textBlock.innerText = slide.content; renderTarget.appendChild(textBlock); } 
            else if (slide.type === 'image') { const imgNode = document.createElement('img'); imgNode.src = slide.content; renderTarget.appendChild(imgNode); } 
            else if (slide.type === 'video') { 
                const videoNode = document.createElement('video'); videoNode.src = slide.content; videoNode.autoplay = true; videoNode.muted = false; videoNode.playsInline = true; renderTarget.appendChild(videoNode); 
                videoNode.onloadedmetadata = function() { if(videoNode.duration < 25) playbackTimeoutLimit = videoNode.duration * 1000; };
            }
            else if (slide.type === 'song') {
                // NEW: audio-status slide — purana text/image/video rendering bilkul waisa hi hai,
                // yeh sirf ek naya slide type hai jo max 15 second ka attached gaana chalata hai.
                const songCard = document.createElement('div');
                songCard.className = 'viewer-song-card';
                songCard.innerHTML = `<div class="viewer-song-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
                    <div class="viewer-song-title">${slide.songName || 'Song'}</div>
                    <div class="viewer-song-artist">${slide.songArtist || ''}</div>`;
                renderTarget.appendChild(songCard);
                const audioNode = new Audio(slide.content);
                audioNode.currentTime = slide.start || 0;
                audioNode.play().catch(() => {});
                renderTarget._statusSongAudio = audioNode;
            }

            let elapsedCounter = 0;
            const intervalTickRate = 50; 
            clearInterval(progressAnimationInterval);
            progressAnimationInterval = setInterval(() => {
                if (isViewerPaused) return;
                elapsedCounter += intervalTickRate;
                const calculatedPercentage = (elapsedCounter / playbackTimeoutLimit) * 100;
                progressBar.style.width = Math.min(calculatedPercentage, 100) + "%";
                if(elapsedCounter >= playbackTimeoutLimit) { clearInterval(progressAnimationInterval); currentSlideIndex++; playSlideshow(); }
            }, intervalTickRate);
        }

        window.deleteCurrentStatus = function() {
            if(confirm("Are you sure you want to delete this status?")) {
                currentViewingStory.slides.splice(currentSlideIndex, 1);
                syncToDatabase();
                if (currentViewingStory.slides.length === 0) closeStatusViewer();
                else { if(currentSlideIndex >= currentViewingStory.slides.length) currentSlideIndex = currentViewingStory.slides.length - 1; playSlideshow(); }
            }
        }

        window.showViewers = function() { isViewerPaused = true; const slide = currentViewingStory.slides[currentSlideIndex]; const listContent = document.getElementById('viewers-list-content'); if (slide.viewedBy.length === 0) listContent.innerHTML = `<div style="color:var(--text-muted);font-size:13px;text-align:center;">No views yet.</div>`; else listContent.innerHTML = slide.viewedBy.map(v => { const vTick = v.hasRedTick || v.redTick ? '<svg viewBox="0 0 24 24" class="red-tick-svg" style="width:14px;height:14px;" title="Verified"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' : ''; return `<div class="viewer-item"><img src="${v.avatar}"><span style="display:flex;align-items:center;">@${v.username}${vTick}</span></div>`; }).join(''); document.getElementById('viewers-list-panel').style.display = 'block'; }
        window.hideViewers = function() { document.getElementById('viewers-list-panel').style.display = 'none'; isViewerPaused = false; }
        async function syncToDatabase() { if(!currentViewingStory) return; const userDocRef = window.doc(window.db, "status_stories", currentViewingStory.uid); try { if (currentViewingStory.slides.length === 0) await window.deleteDoc(userDocRef); else await window.setDoc(userDocRef, currentViewingStory); } catch(e) { console.error("Error updating story state:", e); } }
        window.closeStatusViewer = function() {
        const renderTarget = document.getElementById('viewer-body-render');
        if (renderTarget._statusSongAudio) { renderTarget._statusSongAudio.pause(); renderTarget._statusSongAudio = null; } // NEW: stop song audio on close
        document.getElementById('status-player-modal').style.display = 'none'; document.getElementById('viewers-list-panel').style.display = 'none'; renderTarget.innerHTML = ""; clearInterval(progressAnimationInterval); clearTimeout(storyPlaybackTimer); currentViewingStory = null;
    }
    </script>
</body>
</html>
